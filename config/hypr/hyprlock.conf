################
### GENERAL ###
################

general {
    ignore_empty_input = true
}


##################
### BACKGROUND ###
##################

background {
    monitor =
    path = $HOME/afs/.confs/wallpaper.png   # only png supported for now
}


#####################
### INPUT FIELD ###
#####################

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 40
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}


##############
### LABELS ###
##############

# Clock
label {
    monitor =
    #clock
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = Fira Semibold
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Timer "Locked for XX:YY"
label {
    text = cmd[update:60] \
        bash -c 'LOCKFILE=$HOME/afs/.confs/.locktime; \
                 [ ! -f $LOCKFILE ] && date +%s > $LOCKFILE; \
                 START=$(cat $LOCKFILE); \
                 NOW=$(date +%s); \
                 DIFF=$(( (NOW - START)/60 )); \
                 printf "Locked for %02d:%02d" $((DIFF/60)) $((DIFF%60))'
    color = rgba(200, 200, 200, 1.0)
    font_size = 18
    font_family = Fira Semibold
    position = -100, 190
    halign = right
    valign = bottom
}


